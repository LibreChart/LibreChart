chartjs:
  remote: https://www.chartjs.org
  version: '4.4.9'
  license:
    name: MIT
    url: https://github.com/chartjs/Chart.js/blob/master/LICENSE.md
    gpl-compatible: true
  js:
    # Self-hosted inside the module so it deploys via git and runs offline (LAN).
    js/vendor/chart.umd.min.js: { minified: true, preprocess: false }

daily_report:
  version: 1.x
  css:
    component:
      css/daily-report.css: {}
  js:
    js/daily-report.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
    - librechart_reports/chartjs

traffic_report:
  version: 1.x
  css:
    # Reuses the shared Reports card, tab, and grid styling.
    component:
      css/daily-report.css: {}
  js:
    js/traffic-report.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
    - librechart_reports/chartjs
